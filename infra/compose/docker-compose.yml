name: casefile

services:
  postgres:
    image: postgres:18
    container_name: casefile-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-casefile}
      POSTGRES_USER: ${POSTGRES_USER:-casefile}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casefile_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - casefile-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres-test:
    image: postgres:18
    container_name: casefile-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-casefile_test}
      POSTGRES_USER: ${POSTGRES_TEST_USER:-casefile}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-casefile_test_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-55433}:5432"
    volumes:
      - casefile-postgres-test-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  casefile-postgres-data:
  casefile-postgres-test-data:
