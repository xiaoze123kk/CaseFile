[project]
name = "casefile-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "networkx>=3.3",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
  "datamodel-code-generator==0.68.1",
  "httpx>=0.27",
  "jsonschema[format]==4.26.0",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casefile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "postgres: requires an explicit CASEFILE_TEST_DATABASE_URL and a disposable PostgreSQL database",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
